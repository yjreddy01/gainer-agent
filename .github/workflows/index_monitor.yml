name: Index 15-min monitor (NIFTY, SENSEX, BANKNIFTY)

on:
  schedule:
    - cron: "2,17,32,47 4-9 * * 1-5"   # 9:32 AM - 3:17 PM IST, just after each 15-min candle closes
    - cron: "2 10 * * 1-5"             # 3:32 PM IST (last candle)
  push:
    branches: [main]
    paths: ["index_monitor.py"]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: gainer-agent
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check index formations
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          WHATSAPP_APIKEY: ${{ secrets.WHATSAPP_APIKEY }}
          FAST2SMS_API_KEY: ${{ secrets.FAST2SMS_API_KEY }}
          SMS_NUMBER: ${{ secrets.SMS_NUMBER }}
          SMS_KINDS: buy,daily
          PAGE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python index_monitor.py
      - name: Save results
        run: |
          git config user.name "gainer-agent"
          git config user.email "actions@github.com"
          git add docs signals
          git diff --cached --quiet && exit 0
          git commit -m "Index 15m $(TZ=Asia/Kolkata date +'%F %H:%M')"
          git pull --rebase -X theirs origin main && git push
