name: Daily top-gainer scan

on:
  schedule:
    - cron: "2 4 * * 1-5"     # 04:02 UTC = 9:32 AM IST, Monday-Friday
  workflow_dispatch:           # "Run workflow" button for a manual run

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Run scan, backtest and publish
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PAGE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python publish.py

      - name: Save results to the repository
        run: |
          git config user.name "gainer-agent"
          git config user.email "actions@github.com"
          git add docs signals
          git diff --cached --quiet || git commit -m "Scan results $(date -u +%F)"
          git push
